name: Build and publish Laya decision sidecar

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish (for example, 0.1.0)
        required: true
        type: string
      laya_version:
        description: PyPI Laya version to install
        required: true
        default: "0.3.11"
        type: string
      torch_version:
        description: CPU PyTorch version
        required: true
        default: "2.14.0"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96  # v5.6.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/laya-decision-service
          tags: |
            type=raw,value=${{ inputs.image_tag }}

      - name: Build and push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75  # v6.9.0
        with:
          context: '{{defaultContext}}'
          file: Dockerfile.laya
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LAYA_VERSION=${{ inputs.laya_version }}
            TORCH_VERSION=${{ inputs.torch_version }}
